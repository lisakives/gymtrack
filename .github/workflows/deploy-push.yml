# Ottaa käyttöön push-ilmoituspalvelimen (Cloudflare Worker + D1-tietokanta + ajastin joka minuutti)
# ja kirjoittaa palvelimen osoitteen sovellukseen (js/config.js).
#
# Tarvitaan kerran repositorion asetuksiin (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – Cloudflaren API-tunnus (oikeudet: Workers Scripts: Edit, D1: Edit)
#   CLOUDFLARE_ACCOUNT_ID  – Cloudflaren tilin tunnus
# Käynnistys: Actions → "Push-palvelimen käyttöönotto" → Run workflow.
name: Push-palvelimen käyttöönotto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['push-server/**', '.github/workflows/deploy-push.yml']

permissions:
  contents: write

concurrency:
  group: deploy-push
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Tarkista salaisuudet
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Lisää CLOUDFLARE_API_TOKEN ja CLOUDFLARE_ACCOUNT_ID kohtaan Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testit
        working-directory: push-server
        run: npm test

      - name: Asenna wrangler
        run: npm install -g wrangler@4

      - name: Luo tai hae D1-tietokanta
        working-directory: push-server
        run: |
          find_id() { wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="gymtrack-push") | (.uuid // .id)' | head -1; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            wrangler d1 create gymtrack-push
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::D1-tietokannan luonti epäonnistui. Tarkista, että API-tunnuksella on D1: Edit -oikeus."; exit 1; fi
          echo "D1: $ID"
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml

      - name: Julkaise Worker
        working-directory: push-server
        run: |
          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Workerin osoitetta ei löytynyt. Jos virhe koskee workers.dev-aliverkkotunnusta, avaa Cloudflaressa kerran Workers & Pages ja valitse tunnus."
            exit 1
          fi
          echo "PUSH_URL=$URL" >> "$GITHUB_ENV"

      - name: Tarkista palvelin
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PUSH_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::Palvelin ei vastaa osoitteessa $PUSH_URL"; exit 1

      - name: Kirjoita osoite sovellukseen
        run: |
          cat > js/config.js <<CFG
          /* GymTrack – asetukset. Push-palvelimen käyttöönottotyönkulku
           * (.github/workflows/deploy-push.yml) kirjoittaa osoitteen tähän automaattisesti.
           * Osoitteen voi asettaa myös sovelluksessa: Muistutukset → Ilmoitukset. */
          window.GT = window.GT || {};
          GT.PUSH_SERVER = '$PUSH_URL';
          CFG
          sed -i 's/^          //' js/config.js
          if git diff --quiet js/config.js; then echo "Osoite on jo ajan tasalla"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git commit -m "Aseta push-palvelimen osoite ($PUSH_URL)"
          git push
          echo "### Push-palvelin käytössä: $PUSH_URL" >> "$GITHUB_STEP_SUMMARY"
